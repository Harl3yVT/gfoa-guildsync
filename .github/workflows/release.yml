name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Uploads to CurseForge / Wago are skipped when these secrets are not set (or the .toc has no project id).
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version matches tag
        run: |
          toc_version=$(grep -m1 '^## Version:' GFoAGuildSync/GFoAGuildSync.toc | sed 's/^## Version: *//' | tr -d '\r')
          if [ "v${toc_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match .toc Version ${toc_version}"; exit 1
          fi
      - name: Package and release (GitHub release + release.json for WowUp, CurseForge, Wago)
        uses: BigWigsMods/packager@v2
