name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          toc_version=$(grep -m1 '^## Version:' GFoAGuildSync/GFoAGuildSync.toc | sed 's/^## Version: *//' | tr -d '\r')
          if [ "v${toc_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match .toc Version ${toc_version}"; exit 1
          fi
      - name: Zip the addon folder
        run: zip -r "GFoAGuildSync-${GITHUB_REF_NAME}.zip" GFoAGuildSync
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "GFoAGuildSync-${GITHUB_REF_NAME}.zip" \
            --title "GFoA Guild Sync ${GITHUB_REF_NAME}" --generate-notes
